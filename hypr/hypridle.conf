## LINUX INTEGRATIONS
general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

## TURNING MONITORS ON LOW 6 MIN
listener {
    timeout = 360
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

## TURNING KEYBOARD LIGHTS OFF 6 MIN
listener {
    timeout = 360
    on-timeout = brightnessctl -sd rgb:kdb_backlight set 0
    on-resume  = brightnessctl -rd rgb:kbd_backlight
}

## LOCK SCREEN 7 MIN
listener {
    timeout = 420
    on-timeout = hyprlock
}

## TURNING SCREEN OFF 10 MIN
listener {
    timeout = 600                                                                                  # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

## SUSPEND PC 30 MIN
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
