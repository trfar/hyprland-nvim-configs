## LINUX INTEGRATIONS
general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    before_sleep_cmd = loginctl lock-session
}

## LOCK SCREEN 15 MIN
listener {
    timeout = 900
    on-timeout = hyprlock
}

## TURNING SCREEN OFF 30 MIN
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

## R9700 RADIANCE OFF 5H55M
## zsh -ic loads .zshrc: hypridle runs commands via /bin/sh which has no aliases
listener {
    timeout = 21300
    on-timeout = zsh -ic 'radoff'
}

## SUSPEND 6 HOURS (no sudo: systemd polkit allows suspend for the active local user)
listener {
    timeout = 21600
    on-timeout = systemctl suspend
}
